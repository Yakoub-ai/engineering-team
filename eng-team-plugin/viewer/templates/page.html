<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src data:; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="generator" content="eng-team present">
<title>{{title}}</title>
<style>{{{css}}}
{{{pageCss}}}</style>
</head>
<body>
<main>
<header>
<h1>{{project}}</h1>
</header>
{{#each sections}}
<section id="{{id}}" data-source="{{source}}">
<h2>{{title}}</h2>
{{{html}}}
</section>
{{/each}}
{{#if gaps}}
<aside class="gaps">
<h2>Missing</h2>
<ul>{{#each gaps}}<li>{{title}}</li>{{/each}}</ul>
</aside>
{{/if}}
</main>
</body>
</html>
