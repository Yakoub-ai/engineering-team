name: validate
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: "22" }
      - name: Validator self-tests
        run: bash eng-team-plugin/tests/validator/test_validate.sh
      - name: Validate plugin structure
        run: bash eng-team-plugin/scripts/validate.sh eng-team-plugin
      - name: Viewer tests
        run: npm test --prefix eng-team-plugin/viewer
      - name: Hook tests
        run: node --test eng-team-plugin/hooks/test/*.test.js
